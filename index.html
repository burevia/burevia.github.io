<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>BUREVIA — Votre renfort administratif à distance</title>

  <style>
    :root{
      --navy:#14243b;
      --gold:#c5a56a;
      --cream:#f7f3ec;
      --white:#ffffff;
      --text:#263342;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--cream);
      color:var(--text);
    }

    header{
      padding:24px 7%;
      display:flex;
      justify-content:center;
    }

    .logo{
      font-weight:800;
      letter-spacing:.16em;
      color:var(--navy);
      font-size:24px;
    }

    .logo span{
      color:var(--gold);
    }

    main{
      min-height:78vh;
      display:grid;
      place-items:center;
      padding:50px 7%;
    }

    .hero{
      max-width:900px;
      text-align:center;
    }

    .eyebrow{
      color:#8a7044;
      font-weight:700;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-size:13px;
    }

    h1{
      font-size:clamp(40px,7vw,76px);
      line-height:1.02;
      color:var(--navy);
      margin:18px 0;
    }

    .accent{
      color:var(--gold);
    }

    p{
      font-size:clamp(18px,2.4vw,23px);
      line-height:1.6;
      max-width:720px;
      margin:0 auto 32px;
    }

    .status{
      display:inline-block;
      background:var(--white);
      border:1px solid #e9e1d5;
      border-radius:999px;
      padding:12px 18px;
      margin:10px 0 30px;
      color:var(--navy);
      font-weight:700;
    }

    a{
      color:var(--navy);
      font-weight:700;
      text-decoration:none;
    }

    footer{
      text-align:center;
      padding:30px;
      color:#66717e;
      font-size:14px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">BURE<span>VIA</span></div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">BUREVIA</div>

      <h1>
        Votre renfort administratif
        <span class="accent">à distance</span>
      </h1>

      <div class="status">
        Site en cours de préparation
      </div>

      <p>
        BUREVIA prépare actuellement son nouvel espace en ligne.
        Notre site complet sera bientôt disponible.
      </p>

      <p>
        <a href="mailto:contact.burevia@gmail.com">
          contact.burevia@gmail.com
        </a>
      </p>
    </section>
  </main>

  <footer>
    BUREVIA — Site en préparation
  </footer>
</body>
</html>
